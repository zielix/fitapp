<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover: aplikacja wchodzi pod "notch" iPhone'a -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FitLog</title>

  <!-- PWA: manifest + ustawienia specyficzne dla iOS -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FitLog">
  <meta name="theme-color" content="#0f172a">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <h1>FitLog</h1>
      <button id="gosiaBtn" class="gosia-btn">dla Gosi 💖</button>
    </div>
    <p class="subtitle" id="weekSummary">—</p>
  </header>

  <main>
    <!-- Widok 1: lista treningów -->
    <section id="view-list" class="view active">
      <div class="stats">
        <div class="stat"><span id="statWeek">0</span><small>w tym tygodniu</small></div>
        <div class="stat"><span id="statTotal">0</span><small>wszystkich</small></div>
        <div class="stat"><span id="statVolume">0</span><small>kg łącznie (tydz.)</small></div>
      </div>
      <h2>Historia</h2>
      <ul id="workoutList" class="list"></ul>
      <p id="emptyState" class="empty">Brak treningów. Dodaj pierwszy przyciskiem +</p>
    </section>

    <!-- Widok 2: nowy trening -->
    <section id="view-add" class="view">
      <h2>Nowy trening</h2>
      <form id="workoutForm">
        <label>Nazwa
          <input name="name" placeholder="np. Push / Nogi / Bieganie" required>
        </label>
        <label>Data
          <input name="date" type="date" required>
        </label>

        <h3>Ćwiczenia</h3>
        <div id="exercises"></div>
        <button type="button" id="addExercise" class="secondary">+ Dodaj ćwiczenie</button>

        <label>Notatka
          <textarea name="note" rows="2" placeholder="Jak poszło?"></textarea>
        </label>

        <div class="row">
          <button type="button" id="cancelAdd" class="secondary">Anuluj</button>
          <button type="submit">Zapisz</button>
        </div>
      </form>
    </section>
  </main>

  <button id="fab" class="fab" aria-label="Dodaj trening">+</button>

  <!-- Niespodzianka dla Gosi: tańcząca świnka (rysunek SVG + animacje CSS) -->
  <div id="pigOverlay" class="pig-overlay" hidden>
    <div class="hearts" id="hearts"></div>
    <svg class="pig" viewBox="0 0 200 220" aria-label="Tańcząca świnka">
      <!-- nóżki (machają na zmianę) -->
      <g class="leg leg-l"><rect x="68" y="150" width="18" height="40" rx="9" fill="#f9a8c9"/><rect x="68" y="180" width="18" height="12" rx="5" fill="#be6b8f"/></g>
      <g class="leg leg-r"><rect x="114" y="150" width="18" height="40" rx="9" fill="#f9a8c9"/><rect x="114" y="180" width="18" height="12" rx="5" fill="#be6b8f"/></g>
      <g class="pig-body">
        <!-- ogonek -->
        <path class="tail" d="M150 120 q14 -6 10 -16 q-4 -8 -10 0 q-4 8 8 10" stroke="#f472a6" stroke-width="4" fill="none" stroke-linecap="round"/>
        <!-- brzuszek -->
        <ellipse cx="100" cy="125" rx="52" ry="42" fill="#fbb6d0"/>
        <!-- rączki -->
        <g class="arm arm-l"><rect x="40" y="108" width="34" height="14" rx="7" fill="#f9a8c9"/></g>
        <g class="arm arm-r"><rect x="126" y="108" width="34" height="14" rx="7" fill="#f9a8c9"/></g>
        <!-- głowa -->
        <g class="pig-head">
          <path class="ear ear-l" d="M58 40 L52 10 L82 30 Z" fill="#f472a6"/>
          <path class="ear ear-r" d="M142 40 L148 10 L118 30 Z" fill="#f472a6"/>
          <circle cx="100" cy="62" r="46" fill="#fbcfe0"/>
          <!-- oczka -->
          <circle cx="82" cy="52" r="6" fill="#1f2937"/><circle cx="84" cy="50" r="2" fill="#fff"/>
          <circle cx="118" cy="52" r="6" fill="#1f2937"/><circle cx="120" cy="50" r="2" fill="#fff"/>
          <!-- rumieńce -->
          <ellipse cx="68" cy="74" rx="9" ry="5" fill="#f472a6" opacity=".5"/>
          <ellipse cx="132" cy="74" rx="9" ry="5" fill="#f472a6" opacity=".5"/>
          <!-- ryjek -->
          <ellipse cx="100" cy="76" rx="20" ry="14" fill="#f9a8c9" stroke="#f472a6" stroke-width="2"/>
          <ellipse cx="93" cy="76" rx="3.5" ry="5" fill="#be6b8f"/>
          <ellipse cx="107" cy="76" rx="3.5" ry="5" fill="#be6b8f"/>
          <!-- uśmiech -->
          <path d="M90 96 q10 8 20 0" stroke="#be6b8f" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
    <p class="pig-text">Dla Gosi! 🐷💖</p>
    <p class="pig-hint">dotknij, żeby zamknąć</p>
  </div>

  <!-- Szablon jednego ćwiczenia (klonowany przez JS) -->
  <template id="exerciseTpl">
    <div class="exercise">
      <input class="ex-name" placeholder="Ćwiczenie (np. Wyciskanie)" required>
      <div class="ex-nums">
        <input class="ex-sets" type="number" inputmode="numeric" placeholder="serie" min="1">
        <input class="ex-reps" type="number" inputmode="numeric" placeholder="powt." min="1">
        <input class="ex-weight" type="number" inputmode="decimal" placeholder="kg" step="0.5" min="0">
        <button type="button" class="ex-remove" aria-label="Usuń">✕</button>
      </div>
    </div>
  </template>

  <script src="app.js"></script>
</body>
</html>
